version: '3.8'

services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: clinicadmin
      POSTGRES_PASSWORD: clinicpassword123
      POSTGRES_DB: clinic_demo
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:latest
    restart: always
    ports:
      - "5679:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Asia/Kolkata
      - N8N_SECURE_COOKIE=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/data
      - WEBHOOK_URL=http://localhost:5679/
    volumes:
      - ./n8n-data:/home/node/.n8n
      - ./shared-files:/data
    depends_on:
      - postgres

  ollama:
    image: ollama/ollama:latest
    restart: always
    ports:
      - "11435:11434"
    volumes:
      - ./ollama-data:/root/.ollama